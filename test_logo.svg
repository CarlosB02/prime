<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -10 900 1030" width="800" height="950">
  <defs>
    <!-- Background / Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Metallic Gradient Loop -->
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0099ff" />
      <stop offset="30%" stopColor="#0088ee" />
      <stop offset="70%" stopColor="#0066cc" />
      <stop offset="100%" stopColor="#004499" />
    </linearGradient>

    <!-- Metallic Gradient Stem -->
    <linearGradient id="stemGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#00aaff" />
      <stop offset="40%" stopColor="#0077dd" />
      <stop offset="80%" stopColor="#004499" />
      <stop offset="100%" stopColor="#002266" />
    </linearGradient>

    <!-- Cyan Highlight Rim Gradient -->
    <linearGradient id="cyanRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#7dd3fc" />
      <stop offset="100%" stopColor="#00f0ff" />
    </linearGradient>

    <!-- Outer Bevel Stroke Gradient -->
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#67e8f9" />
      <stop offset="40%" stopColor="#0284c7" />
      <stop offset="80%" stopColor="#0369a1" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>
  </defs>

  <g id="pr1me-logo">
    <!-- 1. Outer Sweeping Loop -->
    <path
      d="M 0,10 L 570,10 C 745,10 855,130 855,290 C 855,450 745,580 570,580 L 285,580 L 395,470 L 550,470 C 660,470 725,395 725,290 C 725,185 660,120 550,120 L 110,120 Z"
      fill="url(#loopGrad)"
      stroke="url(#strokeGrad)"
      strokeWidth="14"
      strokeLinejoin="miter"
      strokeMiterlimit="4"
    />

    <!-- Loop Inner Bevel Highlight -->
    <path
      d="M 14,24 L 565,24 C 730,24 840,138 840,290 C 840,442 730,566 565,566 L 299,566 L 395,470 L 550,470 C 660,470 725,395 725,290 C 725,185 660,120 550,120 L 110,120 Z"
      fill="none"
      stroke="#00f0ff"
      strokeWidth="4"
      strokeOpacity="0.8"
    />

    <!-- 2. Left Angled Stem -->
    <path
      d="M 265,280 L 435,280 L 195,520 L 195,975 L 65,845 L 65,480 Z"
      fill="url(#stemGrad)"
      stroke="url(#strokeGrad)"
      strokeWidth="14"
      strokeLinejoin="miter"
      strokeMiterlimit="4"
    />

    <!-- Stem Inner Bevel Highlight -->
    <path
      d="M 279,294 L 415,294 L 181,528 L 181,950 L 79,848 L 79,486 Z"
      fill="none"
      stroke="#00f0ff"
      strokeWidth="4"
      strokeOpacity="0.75"
    />
  </g>
</svg>